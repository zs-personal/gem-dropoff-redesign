name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No dependency cache: the tree installs in ~1s, so it bought nothing and
      # only added a subsystem that could stall.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `npm ci` hangs on this runner with no output and no clear cause, so this
      # takes the more forgiving install path and logs every fetch, which names
      # the stalling package if it happens again.
      - run: npm install --no-audit --no-fund --loglevel http
        timeout-minutes: 4

      - run: npm run build
        env:
          # project sites live under /<repo>/, so asset URLs need that prefix
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
